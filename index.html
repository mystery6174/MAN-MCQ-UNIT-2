<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 2 Management Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <!-- Start Screen -->
        <div id="start-screen" class="flex-1 flex flex-col justify-center items-center text-center">
            <div class="w-24 h-24 bg-purple-100 rounded-3xl flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Unit 2 Quiz</h1>
            <p class="text-slate-500 mb-8 font-medium italic">Planning and Organizing (150 MCQs)</p>
            <button onclick="startQuiz()" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-purple-700 mb-4 transition-colors">Start Solving</button>
            <a href="index.html" class="text-purple-600 font-bold underline hover:text-purple-800 transition-colors">← Go back</a>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col">
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span id="progress-text" class="text-xs font-bold text-slate-400 uppercase tracking-widest">Question 1/150</span>
                    <span id="score-text" class="bg-purple-50 text-purple-600 px-3 py-1 rounded-full text-xs font-bold">Score: 0</span>
                </div>
                <div class="h-2 w-full bg-slate-200 rounded-full overflow-hidden"><div id="progress-bar" class="h-full bg-purple-500 transition-all duration-300" style="width: 2%"></div></div>
            </div>
            <h2 id="question-text" class="text-xl font-bold text-slate-800 mb-6 leading-snug"></h2>
            <div id="options-container" class="space-y-3 mb-6"></div>
            <div id="explanation-box" class="hidden mb-6 p-4 bg-slate-900 rounded-2xl text-slate-300 text-sm italic border-l-4 border-purple-500"></div>
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-slate-800 text-white py-4 rounded-2xl font-bold text-lg shadow-md mt-auto hover:bg-slate-700 transition-colors">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden flex-1 flex flex-col justify-center items-center text-center">
            <h2 class="text-3xl font-black text-slate-800 mb-8">Results</h2>
            <div class="bg-white p-8 rounded-3xl border border-slate-200 w-full mb-8">

                <p id="final-total" class="text-xs font-bold text-slate-400 uppercase">Correct out of 150</p>
            </div>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold mb-4 hover:bg-slate-800 transition-colors">Retry Quiz</button>
            <a href="index.html" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold text-center hover:bg-purple-700 transition-colors">← Home</a>
        </div>
    </div>

    <script>
        // The correct answer is at index 0 in the source. JavaScript shuffles them randomly at runtime!
        const questions = [
  // 2.1 Creativity and Innovation Management

  {
    q: "Creativity and innovation management involves which of the following?",
    options: [
      "Only managing financial resources",
      "Systematically fostering, developing, and implementing new ideas within an organization",
      "Controlling employee behavior strictly",
      "Reducing product variety"
    ],
    a: 1,
    e: "Creativity and innovation management involves systematically fostering, developing, and implementing new ideas within an organization or personal projects."
  },
  {
    q: "Which creativity technique involves a group generating as many ideas as possible without criticism?",
    options: [
      "Checklist Method",
      "Reverse Brainstorming",
      "Brainstorming",
      "Morphological Analysis"
    ],
    a: 2,
    e: "Brainstorming is a group technique where participants generate as many ideas as possible without criticism. It encourages free thinking and diverse perspectives."
  },
  {
    q: "Which of the following is NOT a variant of brainstorming?",
    options: [
      "Classical brainstorming",
      "Brain writing (silent idea generation)",
      "Electronic brainstorming",
      "Morphological brainstorming"
    ],
    a: 3,
    e: "Variants of brainstorming include classical brainstorming, brain writing (silent idea generation), and electronic brainstorming. Morphological brainstorming is not a listed variant."
  },
  {
    q: "What does SCAMPER stand for in the Checklist Method?",
    options: [
      "Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse",
      "Sort, Create, Analyze, Modify, Plan, Execute, Review",
      "Select, Calculate, Assess, Measure, Prioritize, Evaluate, Redesign",
      "Study, Compare, Apply, Modify, Process, Eliminate, Repeat"
    ],
    a: 0,
    e: "SCAMPER stands for Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse — a checklist technique used in the Checklist Method."
  },
  {
    q: "The Checklist Method in creativity helps primarily in:",
    options: [
      "Generating completely new ideas from scratch only",
      "Refining or innovating existing products and processes",
      "Eliminating all existing products",
      "Creating financial plans"
    ],
    a: 1,
    e: "The Checklist Method uses a structured list of questions or prompts to explore new ideas and helps in refining or innovating existing products and processes."
  },
  {
    q: "In Reverse Brainstorming, participants first identify:",
    options: [
      "The best solutions to the problem",
      "Ways to worsen the problem",
      "Financial implications of the problem",
      "Historical causes of the problem"
    ],
    a: 1,
    e: "In Reverse Brainstorming, instead of generating solutions, participants first identify ways to worsen the problem, then reverse them into potential solutions."
  },
  {
    q: "Reverse Brainstorming encourages which type of thinking?",
    options: [
      "Conventional and traditional thinking",
      "Purely financial thinking",
      "Unconventional thinking revealing hidden aspects of the issue",
      "Statistical thinking"
    ],
    a: 2,
    e: "Reverse Brainstorming encourages unconventional thinking and reveals hidden aspects of the issue."
  },
  {
    q: "Morphological Analysis breaks down a problem into:",
    options: [
      "Financial components",
      "Key parameters and systematically explores all possible combinations",
      "Team roles and responsibilities",
      "Customer feedback categories"
    ],
    a: 1,
    e: "Morphological Analysis breaks down a problem into key parameters and systematically explores all possible combinations."
  },
  {
    q: "If designing a new smartphone, considering size, battery life, materials, and interface separately and recombining them is an example of:",
    options: [
      "Brainstorming",
      "Checklist Method",
      "Reverse Brainstorming",
      "Morphological Analysis"
    ],
    a: 3,
    e: "Morphological Analysis: If designing a new smartphone, factors like size, battery life, materials, and interface are considered separately and recombined in novel ways."
  },
  {
    q: "Morphological Analysis is most useful for:",
    options: [
      "Simple problems with one correct solution",
      "Financial budgeting",
      "Complex problem-solving and product design",
      "Team conflict resolution"
    ],
    a: 2,
    e: "Morphological Analysis is useful for complex problem-solving and product design."
  },
  {
    q: "The Six Thinking Hats technique was developed by:",
    options: [
      "F.W. Taylor",
      "Henri Fayol",
      "Edward de Bono",
      "Peter Drucker"
    ],
    a: 2,
    e: "The Six Thinking Hats technique was developed by Edward de Bono as a structured thinking process."
  },
  {
    q: "In Six Thinking Hats, which hat focuses on facts and data?",
    options: [
      "Red Hat",
      "Black Hat",
      "White Hat",
      "Yellow Hat"
    ],
    a: 2,
    e: "White Hat: Focuses on facts and data."
  },
  {
    q: "In Six Thinking Hats, which hat considers emotions and intuitions?",
    options: [
      "White Hat",
      "Red Hat",
      "Black Hat",
      "Green Hat"
    ],
    a: 1,
    e: "Red Hat: Considers emotions and intuitions."
  },
  {
    q: "In Six Thinking Hats, which hat identifies risks and drawbacks?",
    options: [
      "Yellow Hat",
      "Green Hat",
      "Blue Hat",
      "Black Hat"
    ],
    a: 3,
    e: "Black Hat: Identifies risks and drawbacks."
  },
  {
    q: "In Six Thinking Hats, which hat highlights benefits and positives?",
    options: [
      "Red Hat",
      "Black Hat",
      "Yellow Hat",
      "Blue Hat"
    ],
    a: 2,
    e: "Yellow Hat: Highlights benefits and positives."
  },
  {
    q: "In Six Thinking Hats, which hat encourages creativity and alternative ideas?",
    options: [
      "Green Hat",
      "White Hat",
      "Red Hat",
      "Black Hat"
    ],
    a: 0,
    e: "Green Hat: Encourages creativity and alternative ideas."
  },
  {
    q: "In Six Thinking Hats, which hat manages the thinking process and ensures focus?",
    options: [
      "Yellow Hat",
      "Green Hat",
      "White Hat",
      "Blue Hat"
    ],
    a: 3,
    e: "Blue Hat: Manages the thinking process and ensures focus."
  },
  {
    q: "The Six Thinking Hats technique helps in:",
    options: [
      "Making one-sided decisions quickly",
      "Making well-rounded decisions and reducing conflicts",
      "Eliminating employee participation",
      "Creating financial reports"
    ],
    a: 1,
    e: "Six Thinking Hats helps in making well-rounded decisions and reducing conflicts. Each technique can be used alone or in combination to drive creativity and innovation."
  },
  {
    q: "Which creativity technique is best suited for problems that can be broken down into independent parameters?",
    options: [
      "Brainstorming",
      "Checklist Method",
      "Reverse Brainstorming",
      "Morphological Analysis"
    ],
    a: 3,
    e: "Morphological Analysis is best suited for problems that can be broken down into independent parameters and systematically explored."
  },
  {
    q: "Which is NOT a rule of traditional brainstorming?",
    options: [
      "Encourage wild ideas",
      "Defer judgment",
      "Critique ideas immediately",
      "Aim for quantity over quality"
    ],
    a: 2,
    e: "Critique ideas immediately is NOT a rule of brainstorming. Brainstorming encourages free thinking without criticism or judgment."
  },

  // 2.2 New Product Development & Change Management

  {
    q: "What is the first stage in the New Product Development (NPD) process?",
    options: [
      "Market Testing",
      "Business Analysis",
      "Idea Generation",
      "Commercialization"
    ],
    a: 2,
    e: "Idea Generation is the first stage in NPD where new ideas are born through brainstorming sessions, customer feedback, competitor analysis, and R&D."
  },
  {
    q: "In NPD, which stage evaluates ideas for feasibility, profitability, and alignment with business goals?",
    options: [
      "Idea Generation",
      "Idea Screening",
      "Market Testing",
      "Commercialization"
    ],
    a: 1,
    e: "Idea Screening: Here, ideas are evaluated for their feasibility (can we do it?), profitability (will it make money?), and alignment with business goals."
  },
  {
    q: "In which NPD stage are product concepts tested with potential customers?",
    options: [
      "Idea Screening",
      "Business Analysis",
      "Concept Development & Testing",
      "Product Development & Prototyping"
    ],
    a: 2,
    e: "Concept Development & Testing: Product concepts are developed and tested with potential customers to see if they resonate."
  },
  {
    q: "Which NPD stage involves estimating costs, potential revenue, pricing, and market size?",
    options: [
      "Idea Screening",
      "Business Analysis",
      "Market Testing",
      "Commercialization"
    ],
    a: 1,
    e: "Business Analysis: This involves estimating costs, potential revenue, pricing, and market size."
  },
  {
    q: "In which NPD stage is a prototype created and usability testing performed?",
    options: [
      "Concept Development & Testing",
      "Business Analysis",
      "Product Development & Prototyping",
      "Market Testing"
    ],
    a: 2,
    e: "Product Development & Prototyping: A prototype is created, and usability testing is performed to refine the design."
  },
  {
    q: "Which NPD stage involves launching a small-scale version of the product to gather customer feedback?",
    options: [
      "Business Analysis",
      "Product Development & Prototyping",
      "Market Testing",
      "Commercialization"
    ],
    a: 2,
    e: "Market Testing: A small-scale version of the product is launched to gather customer feedback."
  },
  {
    q: "The full-scale launch of a product including production, marketing, and distribution is called:",
    options: [
      "Market Testing",
      "Product Development",
      "Business Analysis",
      "Commercialization"
    ],
    a: 3,
    e: "Commercialization: This is the full-scale launch of the product, including production, marketing, and distribution."
  },
  {
    q: "Which is the final stage of the NPD process?",
    options: [
      "Market Testing",
      "Commercialization",
      "Continuous Improvement",
      "Business Analysis"
    ],
    a: 2,
    e: "Continuous Improvement: After the product is launched, collecting customer feedback is vital for ongoing refinement. This is the final ongoing stage."
  },
  {
    q: "A company using a controlled launch in a limited market before full-scale introduction is conducting:",
    options: [
      "Market Penetration",
      "Idea Screening",
      "Test Marketing",
      "Commercialization"
    ],
    a: 2,
    e: "Test Marketing: A company uses a controlled launch in a limited market to evaluate product performance before full-scale introduction."
  },
  {
    q: "Which of the following is NOT a source of idea generation for new products?",
    options: [
      "Customer feedback",
      "Competitor analysis",
      "Employee layoffs",
      "Research and development (R&D)"
    ],
    a: 2,
    e: "Employee Layoffs is NOT a source of idea generation. Sources include customer feedback, competitor analysis, brainstorming sessions, and R&D."
  },
  {
    q: "Change management is best defined as:",
    options: [
      "Eliminating all changes in an organization",
      "The structured approach to transitioning individuals, teams, and organizations from a current state to a desired future state",
      "Changing company logos and branding",
      "Managing employee salaries and benefits"
    ],
    a: 1,
    e: "Change management is the structured approach to transitioning individuals, teams, and organizations from a current state to a desired future state. It is critical for successful innovation and adaptation."
  },
  {
    q: "Which change model uses PESTEL analysis (Political, Economic, Social, Technological, Environmental, Legal)?",
    options: [
      "Kotter's 8-Step Model",
      "Lewin's Change Model",
      "ADKAR Model",
      "Identifying the Need for Change step"
    ],
    a: 3,
    e: "Identifying the Need for Change involves recognizing market shifts and using change models like PESTEL analysis (Political, Economic, Social, Technological, Environmental, Legal)."
  },
  {
    q: "Lewin's Change Model involves which three steps?",
    options: [
      "Plan, Execute, Review",
      "Identify, Implement, Evaluate",
      "Unfreeze, Change, Refreeze",
      "Define, Measure, Improve"
    ],
    a: 2,
    e: "Lewin's Change Model involves three steps: Unfreeze-Change-Refreeze."
  },
  {
    q: "According to Kotter's 8-Step Change Model, the first step in implementing change is to:",
    options: [
      "Develop a vision for change",
      "Communicate the change vision",
      "Establish a sense of urgency",
      "Empower employees for broad-based action"
    ],
    a: 2,
    e: "According to Kotter's 8-Step Change Model, the first step is to Establish a sense of urgency."
  },
  {
    q: "Resistance to change in organizations can be caused by:",
    options: [
      "Fear of the unknown only",
      "Lack of trust in leadership only",
      "Poor communication only",
      "All of the above"
    ],
    a: 3,
    e: "Resistance to change in organizations can be caused by fear of the unknown, lack of trust in leadership, and poor communication — all of the above."
  },
  {
    q: "In the ADKAR Model of Change, 'D' stands for:",
    options: [
      "Development",
      "Desire",
      "Decision",
      "Direction"
    ],
    a: 1,
    e: "In the ADKAR Model of Change, 'D' stands for Desire."
  },
  {
    q: "Change agents in an organization are responsible for:",
    options: [
      "Preventing change from happening",
      "Supporting and leading the change process",
      "Resisting management decisions",
      "Only informing employees without involvement"
    ],
    a: 1,
    e: "Change agents in an organization are responsible for supporting and leading the change process."
  },
  {
    q: "Creating a change strategy involves which of the following?",
    options: [
      "Ignoring stakeholder involvement",
      "Defining clear objectives, KPIs, and stakeholder involvement, and developing a change vision",
      "Implementing changes without planning",
      "Avoiding communication with employees"
    ],
    a: 1,
    e: "Creating a Change Strategy involves defining clear objectives, key performance indicators (KPIs), and stakeholder involvement, and developing a change vision."
  },
  {
    q: "Which step in change management involves training programs, restructuring, and process updates?",
    options: [
      "Identifying the Need for Change",
      "Creating a Change Strategy",
      "Implementing the Change",
      "Evaluating & Sustaining the Change"
    ],
    a: 2,
    e: "Implementing the Change: Training programs, restructuring, and process updates are used along with change frameworks like Kotter's 8-Step Model or Lewin's Change Model."
  },
  {
    q: "A strategy to overcome resistance to change includes:",
    options: [
      "Avoiding employee feedback",
      "Implementing changes without informing employees",
      "Communicating the benefits of change clearly",
      "Forcing employees to accept change"
    ],
    a: 2,
    e: "A strategy to overcome resistance to change includes communicating the benefits of change clearly."
  },

  // 2.3 Product Management

  {
    q: "Product Management

        let currentIdx = 0, score = 0, answered = false;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const totalQuestions = questions.length;
            document.getElementById('progress-text').innerText = `Question 1/${totalQuestions}`;
            document.getElementById('final-total').innerText = `Correct out of ${totalQuestions}`;
            
            // Fisher-Yates shuffle for the options
            questions.forEach(q => {
                const originalCorrect = q.options[q.a];
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                q.a = q.options.indexOf(originalCorrect);
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const totalQuestions = questions.length;
            
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / totalQuestions) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-purple-300 hover:bg-purple-50 font-medium text-sm text-slate-700 transition-all";
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            answered = false;
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('#options-container button');
            
            if (idx === q.a) {
                score++;
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                document.getElementById('score-text').innerText = `Score: ${score}`;
            } else {
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                allBtns[q.a].classList.add('border-green-500', 'bg-green-50', 'text-green-700');
            }
            
            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<strong>Explanation:</strong> ${q.e}`;
            exp.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
</body>
</html>
